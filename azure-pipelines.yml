trigger: none

pool:
  name: self-hosted-linux

steps:
- checkout: self
  fetchDepth: 0

# 1️⃣ Prepare SonarCloud
- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: 'SonarCloud-Service'
    organization: 'vishwa2102'
    scannerMode: 'dotnet'
    projectKey: 'vishwasureshkumar9950121_aks-zero-touch'
    projectName: 'aks-zero-touch'

# 2️⃣ Create solution + build (CRITICAL FIX)
- script: |
    dotnet new sln -n temp-sonar
    dotnet sln temp-sonar.sln add dotnet-folder.csproj
    dotnet restore temp-sonar.sln
    dotnet build temp-sonar.sln --configuration Release
  displayName: Create SLN and Build for SonarCloud

# 3️⃣ Analyze
- task: SonarCloudAnalyze@4

# 4️⃣ Publish Quality Gate
- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: '300'
