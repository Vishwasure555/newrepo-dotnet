- task: KubernetesManifest@1
  displayName: Deploy App to AKS (dev)
  inputs:
    action: deploy
    kubernetesServiceConnection: aks-connection
    namespace: dev
    rolloutStatusTimeout: 180
    manifests: |
      k8s/namespace.yaml
      k8s/deployment.yaml
      k8s/service.yaml
      k8s/ingress.yaml
      k8s/secretproviderclass.yaml
    containers: |
      $(acrName).azurecr.io/$(imageName):$(tag)
