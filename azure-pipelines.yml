trigger: none

pool:
  name: self-hosted-linux

steps:
- checkout: self
  fetchDepth: 0

# 1️⃣ Prepare SonarCloud (force same working dir)
- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: 'SonarCloud-Service'
    organization: 'vishwa2102'
    scannerMode: 'dotnet'
    projectKey: 'vishwasureshkumar9950121_aks-zero-touch'
    projectName: 'aks-zero-touch'
  workingDirectory: $(Build.SourcesDirectory)

# 2️⃣ Restore + Build (same directory)
- script: |
    pwd
    ls -la
    dotnet restore dotnet-folder.csproj
    dotnet build dotnet-folder.csproj --configuration Release
  displayName: Restore & Build (.NET)
  workingDirectory: $(Build.SourcesDirectory)

# 3️⃣ Analyze (same directory)
- task: SonarCloudAnalyze@4
  workingDirectory: $(Build.SourcesDirectory)

# 4️⃣ Publish Quality Gate
- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: '300'
